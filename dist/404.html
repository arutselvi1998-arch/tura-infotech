<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tura Infotech — Open portal</title></head><body><p id="message">Opening the requested portal…</p><script>(()=>{const base=location.pathname==='/tura-infotech'||location.pathname.startsWith('/tura-infotech/')?'/tura-infotech/':'/',path=location.pathname.startsWith(base)?'/'+location.pathname.slice(base.length):location.pathname;if(/^\/(?:student|admin|login|register)(?:\/|$)/.test(path)&&!path.includes('//')){const params=new URLSearchParams(location.search);params.set('tura_route',path);location.replace(base+'?'+params.toString())}else{document.querySelector('#message').textContent='Page not found.';const link=document.createElement('a');link.href=base;link.textContent='Go to Tura Infotech';document.body.append(link)}})();</script></body></html>
